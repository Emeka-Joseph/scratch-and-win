<!doctype html>
<html lang="en">
<head>
  {% include "layouts/_head.html" %}
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body style="display:grid;place-items:center;min-height:100vh;background:#0B0B0C;color:#fff;text-align:center;padding:24px">
  <div>
    <div style="font-size:96px;font-weight:800;letter-spacing:-.05em;color:#D7192D;line-height:1">{{ code }}</div>
    <h1 style="margin:14px 0 8px">{{ title }}</h1>
    <p style="color:#9a9aa0;max-width:380px;margin:0 auto 26px">{{ message }}</p>
    <a class="btn btn-primary" href="javascript:history.back()"><i class="bi bi-arrow-left"></i> Go back</a>
  </div>
</body>
</html>
