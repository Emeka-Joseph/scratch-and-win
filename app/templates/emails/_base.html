{% set pal = brand_palette(brand) %}{% set rtl = (lang|default('en')) == 'ar' %}
<!doctype html>
<html lang="{{ lang|default('en') }}" dir="{{ 'rtl' if rtl else 'ltr' }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ brand.name if brand else GROUP_NAME }}</title></head>
<body style="margin:0;padding:0;background:#F2F1EE;font-family:{{ 'Tahoma,Arial' if rtl else 'Helvetica,Arial' }},sans-serif;color:#141414">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F1EE;padding:28px 12px">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:20px;overflow:hidden">
      <tr><td style="background:{{ pal.secondary }};color:{{ pal.on_secondary }};padding:30px 28px;text-align:center">
        {% if brand and brand.logo_path %}<img src="{{ PUBLIC_BASE_URL }}{{ url_for('static', filename=brand.logo_path) }}" alt="{{ brand.name }}" width="64" height="64" style="border-radius:16px;background:#fff;padding:6px;display:inline-block">{% endif %}
        <div style="font-size:22px;font-weight:800;margin-top:10px">{{ brand.localized('name', lang|default('en')) if brand else GROUP_NAME }}</div>
      </td></tr>
      <tr><td style="padding:30px 28px;text-align:{{ 'right' if rtl else 'left' }};font-size:15px;line-height:1.6" dir="{{ 'rtl' if rtl else 'ltr' }}">
        {% block body %}{% endblock %}
      </td></tr>
      <tr><td style="padding:18px 28px;background:#FAFAF8;color:#8a8a90;font-size:12px;text-align:center">{{ GROUP_NAME }}</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
